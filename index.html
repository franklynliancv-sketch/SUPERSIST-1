<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUPERSISTᶜᵛ | ELITE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --naranja: #F47C20; 
            --azul: #002D5A;    
            --oro: #FFD700; 
            --cian: #00FBFF; 
            --rojo: #ff3333; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: radial-gradient(circle at center, #001529 0%, #000 100%);
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            overflow: hidden; 
        }
        
        #space { position: fixed; top: 0; left: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }

        .header { text-align: center; width: 100%; margin-bottom: 5px; z-index: 10; }
        .main-title { font-size: 34px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #fff, var(--oro), var(--naranja)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; filter: drop-shadow(0 0 12px rgba(244, 124, 32, 0.8)); animation: titleGlow 2s infinite alternate; }
        @keyframes titleGlow { from { filter: drop-shadow(0 0 5px var(--naranja)); } to { filter: drop-shadow(0 0 20px var(--oro)); } }
        
        .sub-text { font-size: 10px; color: var(--oro); letter-spacing: 1.5px; text-transform: uppercase; margin-top: -2px; opacity: 0.8; }

        #challenge { font-size: 13px; font-weight: 900; height: 65px; display: flex; align-items: center; justify-content: center; text-transform: uppercase; color: #fff; text-shadow: 0 0 15px var(--naranja); text-align: center; width: 85%; line-height: 1.2; margin: 5px 0; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,124,32,0.2); backdrop-filter: blur(5px); }
        
        .stats-bar { width: 85%; display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: var(--cian); margin-bottom: 4px; text-shadow: 0 0 5px var(--cian); }
        #lives { color: var(--oro); letter-spacing: 3px; font-size: 18px; filter: drop-shadow(0 0 5px var(--oro)); }

        .progress-container { width: 85%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 20px; overflow: hidden; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        #progress-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--rojo), var(--naranja), var(--cian)); transition: 0.1s linear; }

        #arena { position: relative; width: 350px; height: 250px; background: rgba(0, 10, 30, 0.9); border: 2.5px solid var(--naranja); border-radius: 25px; overflow: hidden; box-shadow: 0 0 50px rgba(244, 124, 32, 0.3); }
        
        /* ELIMINADA LA RAYA - AHORA ES UN PORTAL DE LUZ */
        .win-line { 
            position: absolute; 
            right: 0; 
            width: 70px; 
            height: 100%; 
            background: linear-gradient(to left, rgba(0, 251, 255, 0.2), transparent);
            border-left: 2px dashed rgba(0, 251, 255, 0.4);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 9px; 
            font-weight: 900; 
            color: var(--cian); 
            writing-mode: vertical-rl; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--cian);
            animation: portalPulse 1.5s infinite alternate;
        }
        @keyframes portalPulse { from { opacity: 0.4; } to { opacity: 0.9; background: linear-gradient(to left, rgba(0, 251, 255, 0.4), transparent); } }
        
        #player { position: absolute; z-index: 100; left: 20px; top: 100px; transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; align-items: center; }
        .lion-avatar { width: 42px; height: 42px; background: var(--azul); border: 2px solid var(--oro); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 20px var(--oro); animation: lionFloat 2s infinite ease-in-out; }
        @keyframes lionFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); box-shadow: 0 0 30px var(--naranja); } }

        #bubble { position: absolute; bottom: -40px; background: rgba(255,255,255,0.95); color: #000; font-size: 10px; font-weight: 900; padding: 6px 12px; border-radius: 12px; white-space: nowrap; opacity: 0; transition: 0.4s; pointer-events: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1.5px solid var(--oro); }
        #bubble::after { content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 6px solid rgba(255,255,255,0.95); }

        .footprint { position: absolute; font-size: 12px; color: rgba(255, 215, 0, 0.5); pointer-events: none; z-index: 5; animation: fadeFootprint 1.2s forwards; filter: drop-shadow(0 0 2px var(--oro)); }
        @keyframes fadeFootprint { from { opacity: 0.8; transform: scale(1.2) rotate(10deg); } to { opacity: 0; transform: scale(0.5) rotate(-10deg); } }
        
        .obs { position: absolute; font-size: 28px; z-index: 10; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); animation: obsRotate 3s infinite linear; }
        @keyframes obsRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #controls { width: 330px; height: 150px; margin-top: 15px; position: relative; }
        .btn { position: absolute; width: 70px; height: 70px; background: linear-gradient(145deg, var(--azul), #001a35); border: 2px solid var(--naranja); border-radius: 22px; color: #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 0 #001529, 0 10px 20px rgba(0,0,0,0.5); transition: 0.1s; }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #001529, 0 5px 10px rgba(0,0,0,0.5); background: var(--naranja); }
        
        #music-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: 1.5px solid var(--cian); color: var(--cian); border-radius: 50%; width: 45px; height: 45px; z-index: 100; display: flex; align-items: center; justify-content: center; font-size: 20px; backdrop-filter: blur(3px); }

        .shake { animation: shakeArena 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeArena { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>
    <canvas id="space"></canvas>
    <button id="music-btn" onclick="toggleMusic()">🔊</button>
    <audio id="alquimia" loop><source src="Música/alquimia.mp3" type="audio/mpeg"></audio>

    <div class="header">
        <h1 class="main-title">SUPERSISTᶜᵛ</h1>
        <p class="sub-text">Solo los persistentes logran entrar</p>
    </div>

    <div id="challenge">¡UN LEÓN SE LEVANTA Y PERSISTE!</div>
    
    <div class="stats-bar"><span id="lives">⚡⚡⚡</span><span>INTENTO: <span id="att">1</span></span></div>
    <div class="progress-container"><div id="progress-fill"></div></div>

    <div id="arena">
        <div class="win-line">Portal del Éxito 🦁</div>
        <div id="player">
            <div class="lion-avatar">🦁</div>
            <div id="bubble">¡Ya casi llegamos!</div>
        </div>
    </div>

    <div id="controls">
        <button class="btn" id="up" style="top:0; left:130px">▲</button>
        <button class="btn" id="left" style="top:40px; left:25px">◀</button>
        <button class="btn" id="down" style="top:80px; left:130px">▼</button>
        <button class="btn" id="right" style="top:40px; right:25px">▶</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        let px = 20, py = 100, sta = 100, hp = 3, attempts = 1, active = true, musicStarted = false;
        let isHurt = false;
        
        const msg = document.getElementById('challenge');
        const bubble = document.getElementById('bubble');
        const audio = document.getElementById('alquimia');
        const mBtn = document.getElementById('music-btn');
        const playerEl = document.getElementById('player');
        const arena = document.getElementById('arena');

        const phrasesData = {
            "❤️": { list: [ "¡Amores que matan no, metas que dan vida!", "¡No mendigues amor, construye tu valor!", "¡El amor propio es tu mejor activo!", "¡Un León no ruega, un León progresa!", "¡Primero tu imperio, luego el romance!" ], unused: [] },
            "📱": { list: [ "¡El celular es para ganar, no para perder!", "¡Deja de mirar vidas y vive la tuya!", "¡Menos redes sociales, más redes de negocio!", "¡Tu tiempo vale más que un like!" ], unused: [] },
            "🍺": { list: [ "¡No brindes por victorias que aún no tienes!", "¡La resaca no paga tus cuentas!", "¡Un León sobrio ve mejor la oportunidad!" ], unused: [] },
            "🎮": { list: [ "¡Sube de nivel en tu cuenta bancaria!", "¡En la vida real no hay botón de reinicio!", "¡Sé el protagonista de tu propia empresa!" ], unused: [] },
            "🛌": { list: [ "¡La cama es la tumba de los sueños!", "¡Despierta! Tu competencia ya empezó!", "¡Levántate y ruge con fuerza!" ], unused: [] }
        };

        const encouragement = ["¡Ya casi llegamos!", "¡Falta poco, León!", "¡Persiste y vencerás!", "¡Tú puedes!", "¡No te detengas!"];

        for(let key in phrasesData) { phrasesData[key].unused = [...phrasesData[key].list]; }

        function getPhraseByEmoji(emoji) {
            let cat = phrasesData[emoji];
            if (cat.unused.length === 0) { cat.unused = [...cat.list]; }
            const idx = Math.floor(Math.random() * cat.unused.length);
            return cat.unused.splice(idx, 1)[0];
        }

        function toggleMusic() {
            if (audio.paused) { audio.play(); mBtn.innerText = "🔊"; } 
            else { audio.pause(); mBtn.innerText = "🔇"; }
        }

        function createFootprint(x, y) {
            const foot = document.createElement('div');
            foot.className = 'footprint';
            foot.innerText = '🐾';
            foot.style.left = (x + 15) + 'px';
            foot.style.top = (y + 15) + 'px';
            arena.appendChild(foot);
            setTimeout(() => foot.remove(), 1200);
        }

        function showBubble() {
            bubble.innerText = encouragement[Math.floor(Math.random() * encouragement.length)];
            bubble.style.opacity = "1";
            setTimeout(() => { bubble.style.opacity = "0"; }, 1500);
        }

        function move(d) {
            if(!active || isHurt) return;
            if(!musicStarted) { audio.play().catch(()=>{}); musicStarted = true; }
            createFootprint(px, py);
            let step = 32; 
            if(d==='up' && py > 15) py -= step;
            if(d==='down' && py < 190) py += step;
            if(d==='left' && px > 15) px -= step;
            if(d==='right' && px < 260) px += step;
            sta = Math.min(100, sta + 7);
            updatePlayer();
        }

        document.getElementById('up').onclick = () => move('up');
        document.getElementById('down').onclick = () => move('down');
        document.getElementById('left').onclick = () => move('left');
        document.getElementById('right').onclick = () => move('right');

        function updatePlayer() {
            playerEl.style.left = px+'px'; playerEl.style.top = py+'px';
            if(px > 250) win();
        }

        function scramble() {
            const ids = ['up', 'down', 'left', 'right'];
            const zones = [{x: 5, y: 0}, {x: 185, y: 0}, {x: 5, y: 80}, {x: 185, y: 80}];
            zones.sort(() => Math.random() - 0.5);
            ids.forEach((id, index) => {
                const el = document.getElementById(id);
                const zone = zones[index];
                el.style.left = (zone.x + Math.random()*45) + "px";
                el.style.top = (zone.y + Math.random()*10) + "px";
            });
        }

        function reset() {
            attempts++; hp = 3; px = 20; py = 100; sta = 100; isHurt = false;
            document.getElementById('lives').innerText = "⚡⚡⚡";
            document.getElementById('att').innerText = attempts;
            msg.innerText = "¡UN LEÓN SE LEVANTA Y PERSISTE!";
            initObs(); updatePlayer();
            document.getElementById('up').style = "top:0; left:130px";
            document.getElementById('down').style = "top:80px; left:130px";
            document.getElementById('left').style = "top:40px; left:25px";
            document.getElementById('right').style = "top:40px; right:25px";
        }

        function win() {
            active = false;
            msg.innerText = "¡BIENVENIDO AL ÉXITO, LEÓN! ✨";
            confetti({ particleCount: 300, spread: 100, colors: ['#F47C20', '#002D5A', '#FFD700'] });
            setTimeout(() => window.location.href='home.html', 3000);
        }

        let obs = [];
        function initObs() {
            obs.forEach(o => o.el.remove()); obs = [];
            const allIcons = Object.keys(phrasesData);
            const selectedIcons = allIcons.sort(() => Math.random() - 0.5).slice(0, 3);
            selectedIcons.forEach((icon, i) => {
                const el = document.createElement('div'); el.className = 'obs'; el.innerText = icon;
                arena.appendChild(el);
                obs.push({ x: 120+(i*65), y: Math.random()*180, v: 3.5+Math.random()*2.5, d: 1, icon, el });
            });
        }

        const cvs = document.getElementById('space'); const ctx = cvs.getContext('2d');
        cvs.width = window.innerWidth; cvs.height = window.innerHeight;
        const stars = Array(45).fill().map(()=>({x: Math.random()*cvs.width, y: Math.random()*cvs.height, s: Math.random()*2.5, o: Math.random()}));

        function loop() {
            if(active) {
                sta -= 0.35;
                document.getElementById('progress-fill').style.width = sta+"%";
                if(sta <= 0) reset();
                obs.forEach(o => {
                    o.y += o.v * o.d; if(o.y > 210 || o.y < 10) o.d *= -1;
                    o.el.style.left = o.x+'px'; o.el.style.top = o.y+'px';
                    if(Math.abs(px-o.x) < 35 && Math.abs(py-o.y) < 35 && !isHurt) {
                        hp--; o.y = -300;
                        isHurt = true;
                        arena.classList.add('shake');
                        msg.innerText = getPhraseByEmoji(o.icon);
                        showBubble(); 
                        document.getElementById('lives').innerText = "⚡".repeat(hp);
                        scramble();
                        setTimeout(() => { isHurt = false; arena.classList.remove('shake'); }, 800);
                        if(hp<=0) reset();
                    }
                });
            }
            ctx.clearRect(0,0,cvs.width,cvs.height); 
            stars.forEach(s => { 
                s.y += 0.8; 
                if(s.y > cvs.height) s.y = 0; 
                ctx.fillStyle = `rgba(255, 255, 255, ${s.o})`; 
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.s, 0, Math.PI*2);
                ctx.fill();
            });
            requestAnimationFrame(loop);
        }
        initObs(); updatePlayer(); loop();
    </script>
</body>
</html>
